name: Model Info Refresh

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # PAT (trusted user) so the PR is authored by a human, not
          # github-actions[bot]; bot-authored PRs require manual CI approval.
          token: ${{ secrets.REFRESH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Refresh model info
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PAT }}
        run: |
          git config user.name "landfallbox"
          git config user.email "landfallbox@gmail.com"
          npm run modelinfo:refresh -- --commit
