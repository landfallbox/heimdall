name: CodeRabbit Review

# CodeRabbit 对 < 10 stars 的公开仓库不再自动审查，
# 这里在 PR 开启以及有新代码推送（synchronize）时自动评论 @coderabbitai review 触发审查。
#
# 注意：CodeRabbit 忽略所有 [bot] 账号的评论（防 bot 互触发死循环），
# 因此必须用人类账号的 PAT（scope: public_repo）存于
# CODERABBIT_TRIGGER_TOKEN secret，不能用 GITHUB_TOKEN。
on:
  # 用 pull_request_target（而非 pull_request）：对 fork PR 也能触发并评论。
  # 本 workflow 不 checkout PR 代码、不执行任何来自 PR 的内容，仅读取
  # PR 编号（数字）与 draft（布尔）并发评论，因此 target 事件无 secret 泄露风险。
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "要触发审查的 PR 编号（留空则不执行）"
        required: false

# 避免多 commit 并发触发时重复评论，按 PR 串行执行
concurrency:
  group: coderabbit-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  trigger-review:
    runs-on: windows-latest

    steps:
      - name: Trigger CodeRabbit review
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CODERABBIT_TRIGGER_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MANUAL_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Error "Missing CODERABBIT_TRIGGER_TOKEN secret. CodeRabbit ignores [bot] comments, so a human-account PAT (scope: public_repo) is required."
            exit 1
          }
          # 手动触发时以输入为准；PR 事件以事件编号为准。
          $prNumber = if ($env:MANUAL_PR_NUMBER) { $env:MANUAL_PR_NUMBER } else { $env:PR_NUMBER }
          if (-not $prNumber) {
            Write-Output "No PR number; nothing to do."
            exit 0
          }
          # 草稿状态：PR 事件用事件载荷；手动 dispatch 时直接查询该 PR。
          $isDraft = $env:PR_DRAFT
          if ($env:MANUAL_PR_NUMBER) {
            $isDraft = gh api "repos/$env:GH_REPOSITORY/pulls/$prNumber" --jq .draft
          }
          # 草稿 PR 等转正式时（ready_for_review）再触发，避免重复评论。
          if ($isDraft -eq "true" -and $env:EVENT_ACTION -ne "ready_for_review") {
            Write-Output "PR is a draft; will trigger on ready_for_review."
            exit 0
          }

          # 获取 PR 当前最新的 head commit SHA
          $headSha = $env:PR_HEAD_SHA
          if (-not $headSha) {
            $headSha = gh api "repos/$env:GH_REPOSITORY/pulls/$prNumber" --jq .head.sha
          }

          $account = gh api user --jq .login

          # 全量分页读取所有历史评论（避免只取第一页漏检长 PR 评论）
          $rawComments = gh api --paginate "repos/$env:GH_REPOSITORY/issues/$prNumber/comments"
          $comments = if ($rawComments) { $rawComments | ConvertFrom-Json } else { @() }

          # 1. 精准去重：检查当前 head commit SHA 是否已经请求过审查
          if ($headSha) {
            $alreadyRequestedSha = @($comments | Where-Object {
              $_.user.login -eq $account -and
              $_.body -match "@coderabbitai\s+review" -and
              $_.body -match [regex]::Escape($headSha)
            })
            if ($alreadyRequestedSha.Count -gt 0) {
              Write-Output "CodeRabbit review already requested for head commit $headSha; skipping."
              exit 0
            }
          }

          # 2. 兜底去重：如果 PR 最新一条评论仍是该账号发出的 @coderabbitai review（CodeRabbit 尚未响应），跳过
          if ($comments.Count -gt 0) {
            $last = $comments[-1]
            if ($last.user.login -eq $account -and $last.body -match "@coderabbitai\s+review") {
              Write-Output "Latest comment is already a pending CodeRabbit review request; skipping."
              exit 0
            }
          }

          # 在评论中附带 head commit SHA，便于后续精准去重
          $commentBody = if ($headSha) {
            "@coderabbitai review`n<!-- head: $headSha -->"
          } else {
            "@coderabbitai review"
          }

          # 无 checkout 步骤，显式指定 repo。
          gh pr comment $prNumber --repo $env:GH_REPOSITORY --body $commentBody
