name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Syntax check
        shell: pwsh
        run: npm run check

      - name: Smoke tests
        shell: pwsh
        run: npm test

      - name: Build GUI
        shell: pwsh
        run: npm run gui:build

  security-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Security review (diff-only, informational)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECURITY_REVIEW_API_KEY: ${{ secrets.SECURITY_REVIEW_API_KEY }}
          SECURITY_REVIEW_BASE_URL: ${{ vars.SECURITY_REVIEW_BASE_URL }}
          SECURITY_REVIEW_MODEL: ${{ vars.SECURITY_REVIEW_MODEL }}
        run: node scripts/security-review.mjs

  electron-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Build GUI
        shell: pwsh
        run: npm run gui:build

      - name: Electron lifecycle tests
        shell: pwsh
        run: npm run test:electron
