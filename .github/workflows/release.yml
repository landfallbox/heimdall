name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Validate release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion."
          }

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Install Electron runtime
        shell: pwsh
        run: npm run electron:install

      - name: Validate and test
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run gui:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Detect release channel
        id: channel
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -match '-beta') {
            echo "channel=beta" >> "$env:GITHUB_OUTPUT"
          } else {
            echo "channel=stable" >> "$env:GITHUB_OUTPUT"
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          if ("${{ steps.channel.outputs.channel }}" -eq "beta") {
            npm run dist:windows -- --publish never --channel beta
          } else {
            npm run dist:windows -- --publish never
          }

      - name: Validate Windows release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $yml = if ("${{ steps.channel.outputs.channel }}" -eq "beta") { "latest-beta.yml" } else { "latest.yml" }
          $assets = @(
            "release/heimdall-Setup-$version.exe",
            "release/heimdall-Setup-$version.exe.blockmap",
            "release/$yml"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset -PathType Leaf)) {
              throw "Missing release asset: $asset"
            }
          }

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          $yml = if ("${{ steps.channel.outputs.channel }}" -eq "beta") { "latest-beta.yml" } else { "latest.yml" }
          $staging = "release-staging/windows"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Get-ChildItem -Path "release/heimdall-Setup-*.exe" -ErrorAction Stop |
            Copy-Item -Destination $staging
          Get-ChildItem -Path "release/heimdall-Setup-*.exe.blockmap" -ErrorAction Stop |
            Copy-Item -Destination $staging
          Copy-Item -Path "release/$yml" -Destination $staging -ErrorAction Stop

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v5
        with:
          name: windows-release
          path: release-staging/windows
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Validate release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion."
          }

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Validate and test
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run gui:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build macOS installers
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          $signingVariables = @(
            "CSC_LINK",
            "CSC_KEY_PASSWORD",
            "APPLE_ID",
            "APPLE_APP_SPECIFIC_PASSWORD",
            "APPLE_TEAM_ID"
          )
          foreach ($name in $signingVariables) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Remove-Item -Path "Env:$name" -ErrorAction SilentlyContinue
            }
          }
          if (-not (Test-Path Env:CSC_LINK)) {
            $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
            Write-Output "Apple signing certificate is not configured; building unsigned macOS installers."
          }
          if ("${{ github.ref_name }}" -match '-beta') {
            npm run dist:mac -- --publish never --channel beta
          } else {
            npm run dist:mac -- --publish never
          }

      - name: Validate macOS release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $yml = if ("${{ github.ref_name }}" -match '-beta') { "latest-beta-mac.yml" } else { "latest-mac.yml" }
          $assets = @(
            "release/heimdall-$version-mac-universal.dmg",
            "release/heimdall-$version-mac-universal.dmg.blockmap",
            "release/heimdall-$version-mac-universal.zip",
            "release/heimdall-$version-mac-universal.zip.blockmap",
            "release/$yml"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset -PathType Leaf)) {
              throw "Missing release asset: $asset"
            }
          }

      - name: Stage macOS release assets
        shell: pwsh
        run: |
          $staging = "release-staging/macos"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $yml = if ("${{ github.ref_name }}" -match '-beta') { "latest-beta-mac.yml" } else { "latest-mac.yml" }
          $assets = @(
            "release/heimdall-*-mac-universal.dmg",
            "release/heimdall-*-mac-universal.dmg.blockmap",
            "release/heimdall-*-mac-universal.zip",
            "release/heimdall-*-mac-universal.zip.blockmap",
            "release/$yml"
          )
          foreach ($pattern in $assets) {
            $files = Get-ChildItem -Path $pattern -ErrorAction Stop
            if (-not $files) { throw "No files matched: $pattern" }
            $files | Copy-Item -Destination $staging
          }

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v5
        with:
          name: macos-release
          path: release-staging/macos
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect release channel
        id: channel
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -match '-beta') {
            echo "channel=beta" >> "$env:GITHUB_OUTPUT"
            echo "win_yml=release-assets/latest-beta.yml" >> "$env:GITHUB_OUTPUT"
            echo "mac_yml=release-assets/latest-beta-mac.yml" >> "$env:GITHUB_OUTPUT"
          } else {
            echo "channel=stable" >> "$env:GITHUB_OUTPUT"
            echo "win_yml=release-assets/latest.yml" >> "$env:GITHUB_OUTPUT"
            echo "mac_yml=release-assets/latest-mac.yml" >> "$env:GITHUB_OUTPUT"
          }

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        id: generate-notes
        continue-on-error: true
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
          RELEASE_NOTES_BASE_URL: ${{ vars.RELEASE_NOTES_BASE_URL}}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL}}
        run: |
          node scripts/generate-release-notes.mjs
          if [ -s release-notes.md ]; then
            echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "notes_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          body: ${{ steps.generate-notes.outputs.notes_file != '' && format('file({0})', steps.generate-notes.outputs.notes_file) || '' }}
          fail_on_unmatched_files: true
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
          make_latest: ${{ steps.channel.outputs.channel == 'beta' && false || true }}
          files: |
            release-assets/heimdall-Setup-*.exe
            release-assets/heimdall-Setup-*.exe.blockmap
            ${{ steps.channel.outputs.win_yml }}
            release-assets/heimdall-*-mac-universal.dmg
            release-assets/heimdall-*-mac-universal.dmg.blockmap
            release-assets/heimdall-*-mac-universal.zip
            release-assets/heimdall-*-mac-universal.zip.blockmap
            ${{ steps.channel.outputs.mac_yml }}
